name: Validate configuration

# Every change to this repository is validated against the schema and the
# cross-reference linter that the AMAN-SIM API itself runs at load time. A
# bundle that fails here would be rejected in production, so this gate is the
# whole point of the repository being separate.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the configuration
        uses: actions/checkout@v4
        with:
          path: config

      # The validator is not published to a registry: CI builds it from the
      # application repository so there is exactly one implementation of every
      # rule. AMAN-SIM is a private repository, so this needs a read token —
      # see the README for how to create AMAN_SIM_READ_TOKEN.
      - name: Check out the validator
        uses: actions/checkout@v4
        with:
          repository: vaccfr/aman-sim
          path: aman-sim
          token: ${{ secrets.AMAN_SIM_READ_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: aman-sim/pnpm-lock.yaml

      - name: Install
        working-directory: aman-sim
        run: pnpm install --frozen-lockfile

      - name: Build the validator
        working-directory: aman-sim
        run: pnpm --filter @aman-sim/config-schema build

      - name: Validate the bundle
        run: node aman-sim/packages/config-schema/dist/cli.js config
