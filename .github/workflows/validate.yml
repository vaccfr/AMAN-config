name: Validate configuration

# Every change to this repository is validated against the schema and the
# cross-reference linter kept alongside it — the same code the AMAN-SIM API
# runs at load time. A bundle that fails here would be rejected in production,
# so this gate is the whole point of the repository being separate.
#
# Self-contained: no secrets, no access to any other repository.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check the validator
        run: npm run type-check

      - name: Test the validator
        run: npm test

      - name: Validate the bundle
        run: npm run validate
